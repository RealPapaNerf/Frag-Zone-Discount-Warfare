name: Test and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Allow one deployment at a time; cancel superseded runs rather than queueing.
concurrency:
  group: pages
  cancel-in-progress: true

# Default to read-only. The deploy job widens this for itself; the test job
# runs `npm ci`, which executes dependency install scripts, so it has no
# business holding a Pages token or an OIDC identity.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Runs the layering guard (src/engine must stay renderer-free) and the
      # simulation tests, which need no browser.
      - run: npm test
      - run: npm run build
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Preflight: deploy-pages reports a disabled Pages site as a bare 404
      # buried in an Octokit stack trace. Check first and say what to do.
      #
      # Being *enabled* is not enough. With the source left on "Deploy from a
      # branch", this job succeeds, the artifact uploads, deploy-pages reports
      # success — and Pages serves the branch instead, so the live site is the
      # unbundled source and the game never starts. CI stays green while the
      # site is dead. That happened; hence the build_type check below.
      - name: Check GitHub Pages enabled and sourced from Actions
        run: |
          body=$(mktemp)
          status=$(curl -s -o "$body" -w "%{http_code}" \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/${{ github.repository }}/pages)

          case "$status" in
            200)
              build_type=$(jq -r '.build_type // "unknown"' "$body")
              if [ "$build_type" != "workflow" ]; then
                echo "::error::GitHub Pages is enabled but its source is '$build_type', not 'workflow'."
                echo "Pages will serve the repo's branch, not the bundle this workflow builds,"
                echo "so the site will load ./src/main.js and die on the bare 'three' import."
                echo "Fix: https://github.com/${{ github.repository }}/settings/pages"
                echo "     Source -> GitHub Actions, then re-run THIS workflow (Test and deploy)."
                exit 1
              fi
              echo "GitHub Pages is enabled for ${{ github.repository }}, sourced from Actions."
              ;;
            404)
              echo "::error::GitHub Pages is not enabled for ${{ github.repository }}."
              echo "Enable it at https://github.com/${{ github.repository }}/settings/pages"
              echo "and set Source to 'GitHub Actions', then re-run this workflow."
              exit 1
              ;;
            403)
              echo "::error::Access to the GitHub Pages API is forbidden (HTTP 403)."
              echo "Check the organization's Pages and Actions policies."
              exit 1
              ;;
            *)
              echo "::error::Unexpected GitHub Pages API response: HTTP $status"
              exit 1
              ;;
          esac

      # Creates the Pages deployment from the artifact the test job uploaded.
      - id: deployment
        uses: actions/deploy-pages@v5
